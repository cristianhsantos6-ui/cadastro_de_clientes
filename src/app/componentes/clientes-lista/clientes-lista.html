<p>clientes-lista works!</p>

<div class="card">
    <h2>Consulta</h2>
    <div class="busca-box">
        <input type="text" [(ngModel)]="termoBusca" placeholder="Nome">
        <button (click)="atualizarLista()">Pesquisar</button>
    </div>

    <h2>Resultado</h2>
    <table>
        <thead>
            <tr>
                <th>Id</th>
                <th>Nome</th>
                <th>CPF</th>
                <th>Data Nascimento</th>
                <th>Email</th>
                <th>Ações</th>
            </tr>
        </thead>

      <tbody>
        <tr *ngFor="let item of listaClientes">
        <td>{{item.id}}</td>
        <td>{{item.nome}}</td>
        <td>{{item.cpf}}</td>
        <td>{{item.dataNascimento}}</td>
        <td>{{item.emial}}</td>
       <td>
        <button (click)="editar(item)">Editar</button>
           <button (click)="deletar(item.id)" class="btn-deletar">Deletar</button>
       </td>
    </tr>

    <tr *nglf="listaClientes.length === 0">
    <td colspan="6">Nenhum cliente encontrado.</td>
   </tr>
      </tbody>
    </table>
</div>
