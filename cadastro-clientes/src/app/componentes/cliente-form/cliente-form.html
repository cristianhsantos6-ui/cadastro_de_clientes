<div class="card">
  <h2>Dados Pessoais</h2>
  
   <form (ngSubmit)="salvar()">
    <div class="form-grid">
      <div class="form-group">
        <label>Nome *</label>
        <input type="text" [(ngModel)]="cliente.nome" name="nome" required>
      </div>

      <div class="form-group">
        <label>E-mail *</label>
        <input type="email" [(ngModel)]="cliente.email" name="email" required>
      </div>

      <div class="form-group">
        <label>CPF *</label>
        <input type="text" [(ngModel)]="cliente.cpf" name="cpf" placeholder="000.000.000-00" required>
      </div>

      <div class="form-group">
        <label>Data Nascimento *</label>
        <input type="date" [(ngModel)]="cliente.dataNascimento" name="dataNascimento" required>
      </div>

      <div class="form-group">
        <label>UF *</label>
        <select [(ngModel)]="cliente.uf" name="uf" required>
          <option value="" disabled selected>Selecione...</option>
          <option *ngFor="let uf of estados" [value]="uf">{{ uf }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Município *</label>
        <input type="text" [(ngModel)]="cliente.municipio" name="municipio" required>
      </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">
        {{ cliente.id ? 'Atualizar' : 'Cadastrar' }}
      </button>
      <button type="button" (click)="cancelar()" class="btn btn-secondary">
        Limpar
      </button>
    </div>
 
</div>
</form>
